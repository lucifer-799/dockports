<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DockPorts - 登录</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="alternate icon" href="/static/favicon.ico">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #2d3748;
        }
        .login-box {
            width: 100%;
            max-width: 380px;
            margin: 1rem;
            padding: 2rem;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        .login-box h1 {
            margin: 0 0 0.5rem;
            font-size: 1.5rem;
            text-align: center;
        }
        .login-box p.hint {
            margin: 0 0 1.5rem;
            font-size: 0.85rem;
            color: #718096;
            text-align: center;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
        }
        input[type="password"] {
            width: 100%;
            padding: 0.7rem;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 1rem;
        }
        button {
            width: 100%;
            margin-top: 1.2rem;
            padding: 0.7rem;
            border: none;
            border-radius: 6px;
            background: #667eea;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover { background: #5a67d8; }
        .error {
            margin-top: 1rem;
            padding: 0.6rem;
            border-radius: 6px;
            background: #fff5f5;
            color: #c53030;
            font-size: 0.85rem;
            text-align: center;
        }
        .gh-row { width: 100%; display: flex; justify-content: center; margin-top: 0.6rem; }
        .gh-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            opacity: 0.7;
            transition: opacity .15s ease, color .15s ease;
        }
        .gh-mark:hover, .gh-mark:focus { opacity: 1; color: #e2e8f0; }
        .footer {
            margin-top: 1.2rem;
            font-size: 0.75rem;
            color: #a0aec0;
            text-align: center;
        }
    
        /* ===== 主题变量与覆盖（light / dark / auto）===== */
        body[data-theme], body { }
        body {
            --dp-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --dp-box: #ffffff;
            --dp-text: #2d3748;
            --dp-muted: #718096;
            --dp-border: #e2e8f0;
            --dp-input-bg: #ffffff;
        }
        body[data-theme="dark"] {
            --dp-bg: linear-gradient(135deg, #0f172a 0%, #1b2436 100%);
            --dp-box: #1a2438;
            --dp-text: #e2e8f0;
            --dp-muted: #94a3b8;
            --dp-border: #2b3a52;
            --dp-input-bg: #131c2e;
        }
        @media (prefers-color-scheme: dark) {
            body[data-theme="auto"] {
                --dp-bg: linear-gradient(135deg, #0f172a 0%, #1b2436 100%);
                --dp-box: #1a2438;
                --dp-text: #e2e8f0;
                --dp-muted: #94a3b8;
                --dp-border: #2b3a52;
                --dp-input-bg: #131c2e;
            }
        }
        body { background: var(--dp-bg); color: var(--dp-text); }
        .login-box { background: var(--dp-box) !important; color: var(--dp-text); }
        .login-box p.hint, .footer { color: var(--dp-muted) !important; }
        input[type="password"] {
            background: var(--dp-input-bg) !important;
            border-color: var(--dp-border) !important;
            color: var(--dp-text) !important;
        }

        /* 右下角：主题按钮 + GitHub 图标并排 */
        .dp-footer-dock {
            position: fixed;
            right: 12px;
            bottom: 10px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            z-index: 50;
        }
        .theme-toggle {
            display: inline-flex; align-items: center; justify-content: center;
            width: 26px; height: 26px;
            color: var(--dp-muted);
            opacity: .7;
            transition: opacity .15s ease, color .15s ease;
        }
        .theme-toggle:hover, .theme-toggle:focus { opacity: 1; color: var(--dp-text); }
        .theme-toggle .theme-icon { display: none; }
        .theme-toggle[data-mode="light"] .theme-icon--light { display: block; }
        .theme-toggle[data-mode="dark"] .theme-icon--dark { display: block; }
        .theme-toggle[data-mode="auto"] .theme-icon--auto { display: block; }

        /* ===== 1.0.8 工具区：两独立链接 + 三主题按钮 ===== */
        .login-tools { display: flex; flex-direction: column; align-items: center; gap: .75rem; }
        .version-container { font-size: 15px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; gap: .45rem; text-decoration: none; }
        .version-container a, .version-container a:hover, .version-container a:focus,
        .version-container a:visited, .version-container a:active {
            text-decoration: none !important; color: var(--dp-muted); cursor: pointer;
        }
        .version-container a:hover { color: var(--dp-text); }
        .version-container .icon { width: 1em; height: 1em; display: block; }
        .version-container .github-icon { display: block; line-height: 0; }
        .version-container .version-text { font-size: 15px; font-weight: 600; line-height: 1; }
        body[data-theme="dark"] .version-container .icon { filter: invert(1); }
        .theme-row { display: inline-flex; align-items: center; gap: .3rem; }
        .theme-btn { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; padding: 0; border: 1px solid var(--dp-border); border-radius: 6px; background: transparent; color: var(--dp-muted); cursor: pointer; opacity: .7; }
        .theme-btn:hover { opacity: 1; color: var(--dp-text); }
        .theme-btn.active { opacity: 1; color: #fff; background: #667eea; border-color: #667eea; }
</style>
</head>
<body data-theme="auto">
    <div class="login-box">
        <h1>🐳 DockPorts</h1>
        <p class="hint">本实例已启用访问密码，请输入密码继续</p>
        <form method="post" action="/login">
            <input type="hidden" name="next" value="{{ next_path }}">
            <label for="password">访问密码</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
            <button type="submit">登 录</button>
        </form>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <div class="footer">密码由环境变量 DOCKPORTS_AUTH_PASSWORD 配置，不保存在仓库中</div>
        <div class="dp-footer-dock">
            <div class="login-tools">
<div class="version-container">
                    <a class="github-link" href="https://github.com/lucifer-799/dockports"
                       target="_blank" rel="noopener" title="GitHub 仓库" aria-label="GitHub 仓库">
                        <span class="github-icon"><img src="/static/github-light.svg" class="icon" width="15" height="15" alt="GitHub" loading="lazy"></span>
                    </a>
                    <a class="version-link" href="https://github.com/lucifer-799/dockports/releases"
                       target="_blank" rel="noopener" title="查看 Release" aria-label="查看版本发布页">
                        <span class="version-text">v1.0.12</span>
                    </a>
                </div>
<div class="theme-row">
                    <button type="button" class="theme-btn" data-mode="auto" title="跟随系统" aria-label="主题：跟随系统"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"></path></svg></button>
                    <button type="button" class="theme-btn" data-mode="light" title="明亮" aria-label="主题：明亮"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path></svg></button>
                    <button type="button" class="theme-btn" data-mode="dark" title="暗夜" aria-label="主题：暗夜"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></button>
                </div>
            </div>
        </div>
    </div>
    <script>

            /* ===== 主题切换（light / dark / auto）===== */
            /* ===== 主题切换（三按钮：auto / light / dark）===== */
            (function () {
                var THEME_KEY = 'dockports-theme';
                var LABELS = { light: '明亮', dark: '暗夜', auto: '跟随系统' };
                var VALID = ['light', 'dark', 'auto'];

                function readSaved() {
                    try {
                        var v = localStorage.getItem(THEME_KEY);
                        return VALID.indexOf(v) >= 0 ? v : 'auto';
                    } catch (e) { return 'auto'; }
                }

                function apply(mode) {
                    document.body.setAttribute('data-theme', mode);
                    document.querySelectorAll('.theme-btn').forEach(function (btn) {
                        var on = btn.getAttribute('data-mode') === mode;
                        btn.classList.toggle('active', on);
                        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
                    });
                }

                function save(mode) {
                    try { localStorage.setItem(THEME_KEY, mode); } catch (e) { /* 隐私模式忽略 */ }
                }

                window.__dpTheme = {
                    current: 'auto',
                    set: function (mode) {
                        if (VALID.indexOf(mode) < 0) return;
                        this.current = mode;
                        save(mode);
                        apply(mode);
                    },
                    init: function () {
                        var self = this;
                        this.current = readSaved();
                        apply(this.current);

                        document.querySelectorAll('.theme-btn').forEach(function (btn) {
                            btn.addEventListener('click', function () {
                                self.set(btn.getAttribute('data-mode'));
                            });
                        });

                        // 自动模式：系统主题变化时实时切换（仅 auto 激活时生效）
                        try {
                            var mq = window.matchMedia('(prefers-color-scheme: dark)');
                            var onChange = function () {
                                if (self.current === 'auto') apply('auto');
                            };
                            if (mq.addEventListener) mq.addEventListener('change', onChange);
                            else if (mq.addListener) mq.addListener(onChange);
                        } catch (e) { /* 老浏览器忽略 */ }
                    }
                };
                window.__dpTheme.init();
            })();
    </script>
</body>
</html>
