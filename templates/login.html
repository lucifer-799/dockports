<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DockPorts - 登录</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="alternate icon" href="/static/favicon.ico">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #2d3748;
        }
        .login-box {
            width: 100%;
            max-width: 380px;
            margin: 1rem;
            padding: 2rem;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        .login-box h1 {
            margin: 0 0 0.5rem;
            font-size: 1.5rem;
            text-align: center;
        }
        .login-box p.hint {
            margin: 0 0 1.5rem;
            font-size: 0.85rem;
            color: #718096;
            text-align: center;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
        }
        input[type="password"] {
            width: 100%;
            padding: 0.7rem;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 1rem;
        }
        button {
            width: 100%;
            margin-top: 1.2rem;
            padding: 0.7rem;
            border: none;
            border-radius: 6px;
            background: #667eea;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover { background: #5a67d8; }
        .error {
            margin-top: 1rem;
            padding: 0.6rem;
            border-radius: 6px;
            background: #fff5f5;
            color: #c53030;
            font-size: 0.85rem;
            text-align: center;
        }
        .gh-row { width: 100%; display: flex; justify-content: center; margin-top: 0.6rem; }
        .gh-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            opacity: 0.7;
            transition: opacity .15s ease, color .15s ease;
        }
        .gh-mark:hover, .gh-mark:focus { opacity: 1; color: #e2e8f0; }
        .footer {
            margin-top: 1.2rem;
            font-size: 0.75rem;
            color: #a0aec0;
            text-align: center;
        }
    
        /* ===== 主题变量与覆盖（light / dark / auto）===== */
        body[data-theme], body { }
        body {
            --dp-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --dp-box: #ffffff;
            --dp-text: #2d3748;
            --dp-muted: #718096;
            --dp-border: #e2e8f0;
            --dp-input-bg: #ffffff;
        }
        body[data-theme="dark"] {
            --dp-bg: linear-gradient(135deg, #0f172a 0%, #1b2436 100%);
            --dp-box: #1a2438;
            --dp-text: #e2e8f0;
            --dp-muted: #94a3b8;
            --dp-border: #2b3a52;
            --dp-input-bg: #131c2e;
        }
        @media (prefers-color-scheme: dark) {
            body[data-theme="auto"] {
                --dp-bg: linear-gradient(135deg, #0f172a 0%, #1b2436 100%);
                --dp-box: #1a2438;
                --dp-text: #e2e8f0;
                --dp-muted: #94a3b8;
                --dp-border: #2b3a52;
                --dp-input-bg: #131c2e;
            }
        }
        body { background: var(--dp-bg); color: var(--dp-text); }
        .login-box { background: var(--dp-box) !important; color: var(--dp-text); }
        .login-box p.hint, .footer { color: var(--dp-muted) !important; }
        input[type="password"] {
            background: var(--dp-input-bg) !important;
            border-color: var(--dp-border) !important;
            color: var(--dp-text) !important;
        }

        /* 右下角：主题按钮 + GitHub 图标并排 */
        .dp-footer-dock {
            position: fixed;
            right: 12px;
            bottom: 10px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            z-index: 50;
        }
        .theme-toggle {
            display: inline-flex; align-items: center; justify-content: center;
            width: 26px; height: 26px;
            color: var(--dp-muted);
            opacity: .7;
            transition: opacity .15s ease, color .15s ease;
        }
        .theme-toggle:hover, .theme-toggle:focus { opacity: 1; color: var(--dp-text); }
        .theme-toggle .theme-icon { display: none; }
        .theme-toggle[data-mode="light"] .theme-icon--light { display: block; }
        .theme-toggle[data-mode="dark"] .theme-icon--dark { display: block; }
        .theme-toggle[data-mode="auto"] .theme-icon--auto { display: block; }

</style>
</head>
<body data-theme="auto">
    <div class="login-box">
        <h1>🐳 DockPorts</h1>
        <p class="hint">本实例已启用访问密码，请输入密码继续</p>
        <form method="post" action="/login">
            <input type="hidden" name="next" value="{{ next_path }}">
            <label for="password">访问密码</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
            <button type="submit">登 录</button>
        </form>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <div class="footer">密码由环境变量 DOCKPORTS_AUTH_PASSWORD 配置，不保存在仓库中</div>
        <div class="dp-footer-dock">

<a class="theme-toggle" id="themeToggle" href="javascript:void(0)" role="button"
   data-mode="auto" title="切换主题" aria-label="切换主题"
   onclick="window.__dpTheme.toggle();return false;">
  <svg class="theme-icon theme-icon--light" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
    <circle cx="12" cy="12" r="4"></circle>
    <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path>
  </svg>
  <svg class="theme-icon theme-icon--dark" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
  </svg>
  <svg class="theme-icon theme-icon--auto" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
    <circle cx="12" cy="12" r="9"></circle>
    <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"></path>
  </svg>
</a>
            <a class="gh-mark" href="https://github.com/lucifer-799/dockports" target="_blank" rel="noopener" title="GitHub" aria-label="GitHub 仓库"><svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a>
        </div>
    </div>
    <script>

            /* ===== 主题切换（light / dark / auto）===== */
            (function () {
                var THEME_KEY = 'dockports-theme';
                var MODES = ['light', 'dark', 'auto'];
                var LABELS = { light: '明亮', dark: '暗夜', auto: '跟随系统' };

                function readSaved() {
                    try {
                        var v = localStorage.getItem(THEME_KEY);
                        return MODES.indexOf(v) >= 0 ? v : 'auto';
                    } catch (e) { return 'auto'; }
                }

                function apply(mode) {
                    document.body.setAttribute('data-theme', mode);
                    var btn = document.getElementById('themeToggle');
                    if (btn) {
                        var label = LABELS[mode] + '（点击切换）';
                        btn.setAttribute('title', label);
                        btn.setAttribute('aria-label', '切换主题，当前：' + LABELS[mode]);
                        // 图标：light=太阳 / dark=月亮 / auto=半圆
                        btn.setAttribute('data-mode', mode);
                    }
                }

                function save(mode) {
                    try { localStorage.setItem(THEME_KEY, mode); } catch (e) { /* 忽略隐私模式 */ }
                }

                window.__dpTheme = {
                    current: 'auto',
                    init: function () {
                        this.current = readSaved();
                        apply(this.current);
                        // 自动模式：跟随系统主题实时变化
                        try {
                            var mq = window.matchMedia('(prefers-color-scheme: dark)');
                            var self = this;
                            var onChange = function () { if (self.current === 'auto') apply('auto'); };
                            if (mq.addEventListener) mq.addEventListener('change', onChange);
                            else if (mq.addListener) mq.addListener(onChange);
                        } catch (e) { /* 老浏览器忽略 */ }
                    },
                    toggle: function () {
                        var i = MODES.indexOf(this.current);
                        this.current = MODES[(i + 1) % MODES.length];
                        save(this.current);
                        apply(this.current);
                    }
                };
                window.__dpTheme.init();
            })();
    </script>
</body>
</html>
