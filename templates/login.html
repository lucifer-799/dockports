<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DockPorts - 登录</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #2d3748;
        }
        .login-box {
            width: 100%;
            max-width: 380px;
            margin: 1rem;
            padding: 2rem;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        .login-box h1 {
            margin: 0 0 0.5rem;
            font-size: 1.5rem;
            text-align: center;
        }
        .login-box p.hint {
            margin: 0 0 1.5rem;
            font-size: 0.85rem;
            color: #718096;
            text-align: center;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
        }
        input[type="password"] {
            width: 100%;
            padding: 0.7rem;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 1rem;
        }
        button {
            width: 100%;
            margin-top: 1.2rem;
            padding: 0.7rem;
            border: none;
            border-radius: 6px;
            background: #667eea;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover { background: #5a67d8; }
        .error {
            margin-top: 1rem;
            padding: 0.6rem;
            border-radius: 6px;
            background: #fff5f5;
            color: #c53030;
            font-size: 0.85rem;
            text-align: center;
        }
        .footer {
            margin-top: 1.2rem;
            font-size: 0.75rem;
            color: #a0aec0;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🐳 DockPorts</h1>
        <p class="hint">本实例已启用访问密码，请输入密码继续</p>
        <form method="post" action="/login">
            <input type="hidden" name="next" value="{{ next_path }}">
            <label for="password">访问密码</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
            <button type="submit">登 录</button>
        </form>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <div class="footer">密码由环境变量 DOCKPORTS_AUTH_PASSWORD 配置，不保存在仓库中</div>
    </div>
</body>
</html>
